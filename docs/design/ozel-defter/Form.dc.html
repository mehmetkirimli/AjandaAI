<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>AjandaAI Aktivite Formu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Caveat:wght@600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5EEAD4}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 30%, rgba(124,58,237,0.45) 0%, transparent 45%), radial-gradient(circle at 75% 75%, rgba(15,118,110,0.45) 0%, transparent 45%), #0c0918; color: #ffffff; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">

  <div role="dialog" aria-label="Yeni aktivite" style="width: 660px; border-radius: 26px; background: #1b1530; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 60px rgba(124,58,237,0.25); overflow: hidden; display: flex; flex-direction: column">
    <div style="height: 10px; background: linear-gradient(90deg, #15803D, #0F766E 35%, #7C3AED 70%, #C2410C)"></div>
    <div style="height: 22px; display: flex; justify-content: space-around; align-items: center; padding: 0 40px">
      <span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span><span style="width: 7px; height: 12px; border-radius: 4px; background: linear-gradient(#ffffff, #d6d0e8)"></span>
    </div>

    <div style="padding: 10px 32px 28px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'Caveat', cursive; font-size: 24px">yeni bir sayfa açıyoruz</span>
        <div style="flex: 1"></div>
        <button type="button" aria-label="Kapat" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>

      <label for="baslik" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Başlık</label>
      <input id="baslik" type="text" value="Doğum günü" style="height: 56px; border: 0; border-bottom: 2px solid #A78BFA; background: transparent; color: #ffffff; font-family: inherit; font-size: 32px; font-weight: 800; padding: 0; outline: none">

      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #ffffff; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>4 Kasım Çarşamba</button>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>19:30 – 20:30</button>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #ffffff; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"></path><path d="M4 4v4h4"></path></svg>Tekrarla</button>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(251,146,60,0.5); background: rgba(194,65,12,0.25); color: #ffffff; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>1 saat önce hatırlat</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 700">Kategori</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <button type="button" style="height: 76px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(21,128,61,0.25); color: #ffffff; font-family: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Spor</button>
          <button type="button" style="height: 76px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(15,118,110,0.25); color: #ffffff; font-family: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-6l-3-2l-6 1l-5-6h-2l2 7l-5 1l-2-2h-1l1 4"></path></svg>Seyahat</button>
          <button type="button" style="height: 76px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(124,58,237,0.25); color: #ffffff; font-family: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>İş</button>
          <button type="button" aria-pressed="true" style="height: 76px; border-radius: 16px; border: 2px solid #FB923C; background: linear-gradient(135deg, #C2410C, #9A3412); color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 10px 24px rgba(194,65,12,0.45)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"></path></svg>Yeme ve içme</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="not" style="font-size: 13px; font-weight: 700">Not</label>
        <textarea id="not" rows="3" style="border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); padding: 6px 14px; background-color: rgba(0,0,0,0.25); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(255,255,255,0.1) 27px, rgba(255,255,255,0.1) 28px); color: #ffffff; font-family: 'Caveat', cursive; font-size: 22px; line-height: 28px; resize: none">Pasta Ayşe'den, hediye unutma!</textarea>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.08)">Ctrl + Enter</span>
        <span style="font-size: 13px">ile kaydet</span>
        <div style="flex: 1"></div>
        <button type="button" style="height: 48px; padding: 0 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #ffffff; font-family: inherit; font-size: 15px">Vazgeç</button>
        <button type="button" style="height: 48px; padding: 0 26px; border: 0; border-radius: 14px; background: linear-gradient(90deg, #15803D, #0F766E 35%, #7C3AED 70%, #C2410C); color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 12px 30px rgba(124,58,237,0.4); display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l9-10"></path></svg>Deftere yaz</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
