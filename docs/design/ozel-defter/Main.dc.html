<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>AjandaAI Giriş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Caveat:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5EEAD4}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; background: radial-gradient(circle at 15% 20%, #3b1d6e 0%, transparent 45%), radial-gradient(circle at 85% 85%, #0f4c5c 0%, transparent 45%), #120d22; color: #ffffff; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">

  <div style="flex: 1 1 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 56px; gap: 28px; position: relative">
    <svg width="520" height="440" viewBox="0 0 520 440" aria-hidden="true">
      <defs>
        <linearGradient id="kapak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#15803D"></stop>
          <stop offset="0.35" stop-color="#0F766E"></stop>
          <stop offset="0.7" stop-color="#7C3AED"></stop>
          <stop offset="1" stop-color="#C2410C"></stop>
        </linearGradient>
        <linearGradient id="kalem" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#F97316"></stop>
          <stop offset="1" stop-color="#FB923C"></stop>
        </linearGradient>
      </defs>
      <ellipse cx="260" cy="410" rx="200" ry="16" fill="#000000" opacity="0.35"></ellipse>
      <rect x="120" y="40" width="300" height="360" rx="22" fill="#0b0816" transform="rotate(-6 270 220)"></rect>
      <g transform="rotate(-6 270 220)">
        <rect x="110" y="30" width="300" height="360" rx="22" fill="url(#kapak)"></rect>
        <rect x="110" y="30" width="300" height="360" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"></rect>
        <rect x="150" y="80" width="230" height="250" rx="14" fill="#ffffff" fill-opacity="0.12"></rect>
        <line x1="170" y1="130" x2="360" y2="130" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"></line>
        <line x1="170" y1="170" x2="360" y2="170" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"></line>
        <line x1="170" y1="210" x2="330" y2="210" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"></line>
        <line x1="170" y1="250" x2="300" y2="250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"></line>
        <circle cx="180" cy="290" r="10" fill="none" stroke="#86EFAC" stroke-width="3"></circle>
        <path d="M175 290 l4 4 l8 -9" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round"></path>
        <line x1="200" y1="290" x2="320" y2="290" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"></line>
        <g fill="#e9e5f5" stroke="#5b4e86" stroke-width="2">
          <rect x="96" y="60" width="30" height="12" rx="6"></rect>
          <rect x="96" y="100" width="30" height="12" rx="6"></rect>
          <rect x="96" y="140" width="30" height="12" rx="6"></rect>
          <rect x="96" y="180" width="30" height="12" rx="6"></rect>
          <rect x="96" y="220" width="30" height="12" rx="6"></rect>
          <rect x="96" y="260" width="30" height="12" rx="6"></rect>
          <rect x="96" y="300" width="30" height="12" rx="6"></rect>
          <rect x="96" y="340" width="30" height="12" rx="6"></rect>
        </g>
        <rect x="380" y="70" width="18" height="70" rx="3" fill="#F97316"></rect>
      </g>
      <g transform="rotate(12 430 120)">
        <rect x="400" y="60" width="96" height="96" rx="8" fill="#A78BFA"></rect>
        <path d="M400 140 l0 16 l16 0 z" fill="#7C3AED"></path>
        <line x1="414" y1="88" x2="480" y2="88" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
        <line x1="414" y1="106" x2="466" y2="106" stroke="#ffffff" stroke-width="3" stroke-linecap="round"></line>
      </g>
      <g transform="rotate(-10 60 300)">
        <rect x="20" y="260" width="84" height="84" rx="8" fill="#2DD4BF"></rect>
        <line x1="34" y1="286" x2="90" y2="286" stroke="#0b3b36" stroke-width="3" stroke-linecap="round"></line>
        <line x1="34" y1="304" x2="76" y2="304" stroke="#0b3b36" stroke-width="3" stroke-linecap="round"></line>
      </g>
      <g transform="rotate(38 380 330)">
        <rect x="300" y="322" width="170" height="18" rx="9" fill="url(#kalem)"></rect>
        <path d="M470 322 l26 9 l-26 9 z" fill="#fde7d4"></path>
        <rect x="300" y="322" width="22" height="18" rx="4" fill="#4ADE80"></rect>
      </g>
      <g>
        <path d="M40 120 q0 -6 6 -6 h52 q6 0 6 6 v34 q0 22 -32 22 q-32 0 -32 -22 z" fill="#C2410C"></path>
        <path d="M104 128 q18 0 18 14 q0 14 -18 14" fill="none" stroke="#C2410C" stroke-width="6"></path>
        <path d="M58 100 q6 -10 0 -20 M74 100 q6 -10 0 -20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"></path>
      </g>
      <g fill="#4ADE80">
        <path d="M470 220 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"></path>
      </g>
      <g fill="#FDBA74">
        <path d="M70 40 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"></path>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <span style="font-family: 'Caveat', cursive; font-size: 34px; color: #ffffff">Hayatının en düzenli sayfası.</span>
      <span style="font-size: 15px; color: #ffffff; opacity: 0.8">Planla, sürükle, tamamla. Senin defterin, senin düzenin.</span>
    </div>
  </div>

  <div style="width: 520px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 48px; box-sizing: border-box">
    <div style="width: 100%; box-sizing: border-box; padding: 40px; border-radius: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 30px 80px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #15803D, #0F766E 40%, #7C3AED 75%, #C2410C); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(124,58,237,0.45)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"></rect><path d="M3 7h3M3 12h3M3 17h3"></path><path d="M10 12l2 2l4 -4"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">AjandaAI</span>
          <span style="font-family: 'Caveat', cursive; font-size: 20px; color: #ffffff; opacity: 0.85">dijital defterin</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Tekrar hoş geldin</h1>
        <p style="margin: 0; font-size: 15px; color: #ffffff; opacity: 0.75">Defterini açmak için giriş yap.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="eposta" style="font-size: 13px; font-weight: 600">E-posta</label>
        <input id="eposta" type="email" value="mehmet@ornek.com" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: #ffffff; font-family: inherit; font-size: 15px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="sifre" style="font-size: 13px; font-weight: 600">Şifre</label>
        <input id="sifre" type="password" value="sifre12345" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #2DD4BF; background: rgba(0,0,0,0.25); color: #ffffff; font-family: inherit; font-size: 15px; box-shadow: 0 0 0 4px rgba(45,212,191,0.18)">
      </div>
      <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: linear-gradient(90deg, #15803D, #0F766E 35%, #7C3AED 70%, #C2410C); color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 12px 30px rgba(124,58,237,0.4)">Defterimi aç</button>
      <div style="display: flex; justify-content: space-between; font-size: 14px">
        <a href="#">Şifremi unuttum</a>
        <span>Hesabın yok mu? <a href="#">Kayıt ol</a></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
